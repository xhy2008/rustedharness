[package]
name = "rustedharness-gui"
description = "Tauri 2 desktop shell for rustedharness"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:rustedharness-web", "dep:tokio"]

[dependencies]
rustedharness-core = { path = "../core" }
rustedharness-web = { path = "../web", optional = true }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", optional = true }
tauri-build = { version = "2", optional = true }
tokio = { workspace = true, optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }
