[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/tui",
    "crates/web",
    "crates/gui",
]
default-members = [
    "crates/core",
    "crates/cli",
    "crates/tui",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["RustedHarness contributors"]
repository = "https://example.invalid/rustedharness"

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
tui-markdown = "0.3"
async-trait = "0.1"
base64 = "0.22"
async-openai = { version = "0.42", default-features = false, features = ["chat-completion", "responses", "byot", "rustls"] }
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
content_inspector = "0.2"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
data-url = "0.3"
directories = "6"
dunce = "1"
flate2 = "1"
futures-util = "0.3"
globset = "0.4"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
html-escape = "0.3"
html2md = "0.2.17"
html5ever = "0.39"
jsonc-parser = { version = "0.34", features = ["serde"] }
ignore = "0.4"
# Every decoder the crate ships in pure Rust: png, jpeg, gif, webp, bmp, ico,
# tiff, tga, dds, hdr, exr, pnm, qoi and farbfeld. AVIF and HEIC need native
# codecs and are not included.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "ico",
    "tiff",
    "tga",
    "dds",
    "hdr",
    "exr",
    "pnm",
    "qoi",
    "ff",
] }
line-index = "0.1"
lsp-types = "0.97"
markup5ever_rcdom = "0.39"
nix = { version = "0.30", features = ["signal", "process"] }
portable-pty = "0.9"
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
ratatui = "0.30"
rayon = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli"] }
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
shellexpand = { version = "3.1", features = ["path"] }
similar = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-php = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
vt100 = "0.18"
unicode-width = "0.2"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1.2"
which = "8"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

rustedharness-core = { path = "crates/core" }
rustedharness-tui = { path = "crates/tui" }
rustedharness-web = { path = "crates/web" }

# Full DWARF is what makes PDB files 200 MB each; line tables keep file:line in
# backtraces at a fraction of the size.
#
# Incremental compilation is off on purpose. Building this tree from scratch
# takes 35 s without it and 85 s with it; a one-file edit is the other way round
# (35 s without, 10 s with a warm session), so it only pays off after several
# edits in a row - while reserving a per-crate session cache that every build
# family copies (14 GB in one measured `target/`). Opt back in for a long
# editing session with `CARGO_INCREMENTAL=1 cargo test -p <crate>`.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
